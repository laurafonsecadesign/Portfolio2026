name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure SEO using the real public URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/configure-seo.mjs "$SITE_URL"
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp *.html style.css script.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets es _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
