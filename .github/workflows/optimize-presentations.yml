name: One-time PDF optimization for portfolio
on:
  push:
    branches: [compress-portfolio-pdfs-2026]
    paths:
      - ".github/workflows/optimize-presentations.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress-presentations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tooling
        run: python -m pip install --quiet pymupdf
      - name: Try image-only compression with PDF integrity checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile,os,fitz,subprocess

          paths=[
            Path("assets/documents/applaws-presentation.pdf"),
            Path("assets/documents/monk - final presentation.pdf"),
            Path("assets/documents/palocleves-presentation.pdf"),
          ]
          def verify(source,target):
              with fitz.open(source) as old,fitz.open(target) as new:
                  if len(old)!=len(new): return (False,"page count")
                  for a,b in zip(old,new):
                      if abs(a.rect.width-b.rect.width)>0.1 or abs(a.rect.height-b.rect.height)>0.1: return (False,"page size")
                      atext="".join(a.get_text().split())
                      btext="".join(b.get_text().split())
                      if len(atext)>20 and len(btext)<.99*len(atext): return (False,"text lost")
                      if len(b.get_links())<len(a.get_links()): return (False,"links lost")
                  differences=[]
                  for n in sorted({0,len(old)//2,len(old)-1}):
                      a=old[n].get_pixmap(matrix=fitz.Matrix(0.9,0.9),alpha=False)
                      b=new[n].get_pixmap(matrix=fitz.Matrix(0.9,0.9),alpha=False)
                      if (a.width,a.height)!=(b.width,b.height):return (False,"render size")
                      samples_a,samples_b=a.samples,b.samples
                      mae=sum(abs(x-y) for x,y in zip(samples_a,samples_b))/len(samples_a)
                      differences.append(mae)
                  if max(differences)>6:return(False,f"visual difference {max(differences):.2f}")
                  return (True,f"visual max {max(differences):.2f}")
          for path in paths:
              original_size=path.stat().st_size
              best_file=None
              best_size=original_size
              best_method="original"
              candidates=[]
              for dpi,quality in [(160,82),(140,80)]:
                  fd,tmp_name=tempfile.mkstemp(suffix=".pdf")
                  os.close(fd)
                  candidate=Path(tmp_name)
                  candidates.append(candidate)
                  try:
                      with fitz.open(path) as doc:
                          doc.rewrite_images(dpi_threshold=190,dpi_target=dpi,quality=quality)
                          doc.save(candidate,garbage=4,deflate=True,clean=True)
                      size=candidate.stat().st_size
                      good,description=verify(path,candidate)
                      print(f"{path.name}: PyMuPDF dpi={dpi}, quality={quality}, {size/1e6:.2f} MB, valid={good}, {description}",flush=True)
                      if good and size<best_size*.95:
                          best_file,best_size,best_method=candidate,size,f"PyMuPDF dpi={dpi}"
                  except Exception as e:
                      print(f"Skipped candidate for {path.name}: {e}",flush=True)
              if best_file:
                  best_file.replace(path)
              for candidate in candidates:
                  candidate.unlink(missing_ok=True)
              print(f"SELECTED: {path.name} {original_size/1e6:.2f} -> {path.stat().st_size/1e6:.2f} MB ({best_method})",flush=True)

          PY
      - name: Commit optimized PDFs
        run: |
          git add -- assets/documents/applaws-presentation.pdf "assets/documents/monk - final presentation.pdf" assets/documents/palocleves-presentation.pdf
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Optimize more portfolio PDFs without changing text"
            git push origin HEAD:compress-portfolio-pdfs-2026
          else
            echo "No further PDFs met quality and size checks."
          fi
