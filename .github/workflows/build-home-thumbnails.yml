name: Build lightweight homepage previews

on:
  push:
    branches:
      - perf/restore-home-effects-and-thumbnails-20261113
    paths:
      - .github/workflows/build-home-thumbnails.yml
      - scripts/build-home-thumbnails.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-home-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate responsive WebP thumbnails and link them in both languages
        run: python scripts/build-home-thumbnails.py
      - name: Commit generated static assets to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hero-thumbs index.html es/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "perf: generate lightweight previews for both homepage effects"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
